name = "cuentas-familia-api"
main = "index.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "cuentas-familia-db"
database_id = "61ec2b37-c5b9-46d3-98aa-649ddd89b333"

# Se ejecuta a las 03:00 UTC del día 1 de cada mes: genera automáticamente
# un gasto por cada categoría marcada como "fija", usando su presupuesto
# como importe.
[triggers]
crons = ["0 3 1 * *"]
